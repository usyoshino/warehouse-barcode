<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>バーコード読み取り</title>

<style>

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: sans-serif;
  text-align: center;
}

h2 {
  margin: 15px 0;
}

#video {
  width: 100%;
  height: auto;
  max-height: 70vh;
  object-fit: cover;
}

#message {
  padding: 15px;
  font-size: 20px;
}

#result {
  padding: 15px;
  font-size: 24px;
  font-weight: bold;
  background: #fff;
  color: #000;
  margin: 10px;
  border-radius: 8px;
}

button {
  width: 90%;
  padding: 15px;
  margin: 8px;
  font-size: 18px;
  border-radius: 8px;
}

</style>

</head>

<body>

<h2>📷 バーコード読み取り</h2>

<div id="message">
カメラを起動しています…
</div>

<video
  id="video"
  autoplay
  playsinline>
</video>

<div id="result">
読み取り待機中
</div>

<button onclick="startCamera()">
📷 カメラを起動
</button>

<button onclick="stopCamera()">
✕ カメラ停止
</button>


<script>

var stream = null;
var detector = null;
var scanning = false;


/* =========================
   URLから情報を取得
========================= */

var params =
  new URLSearchParams(
    window.location.search
  );

var returnUrl =
  params.get('returnUrl');

var target =
  params.get('target');


/* =========================
   カメラ開始
========================= */

async function startCamera() {

  if (scanning) {
    return;
  }

  var message =
    document.getElementById('message');

  var video =
    document.getElementById('video');

  message.innerText =
    'カメラを起動しています…';


  /* BarcodeDetector確認 */

  if (!('BarcodeDetector' in window)) {

    message.innerText =
      'このスマホのChromeは標準バーコード読み取りに対応していません。';

    alert(
      'このスマホでは標準バーコード読み取り機能が利用できません。'
    );

    return;
  }


  try {

    detector =
      new BarcodeDetector({

        formats: [
          'ean_13',
          'ean_8',
          'code_128',
          'code_39',
          'itf'
        ]

      });


    /* カメラ起動 */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: 'environment'
          }
        },

        audio: false

      });


    video.srcObject = stream;

    await video.play();

    scanning = true;

    message.innerText =
      'バーコードをカメラに映してください';

    scanBarcode();

  }

  catch (error) {

    console.log(error);

    message.innerText =
      'カメラを起動できませんでした';

    alert(
      'カメラを起動できませんでした。\n\n' +
      'エラー：' +
      error.name
    );

  }

}


/* =========================
   バーコード読み取り
========================= */

async function scanBarcode() {

  if (!scanning) {
    return;
  }


  var video =
    document.getElementById('video');


  try {

    var codes =
      await detector.detect(video);


    if (codes.length > 0) {

      var barcode =
        codes[0].rawValue;


      document.getElementById(
        'result'
      ).innerText = barcode;


      document.getElementById(
        'message'
      ).innerText =
        '✅ 読み取り成功';


      stopCamera();


      /* =========================
         倉庫管理画面へ戻る
      ========================= */

      if (returnUrl) {

        var url =
          returnUrl +
          '?barcode=' +
          encodeURIComponent(barcode) +
          '&target=' +
          encodeURIComponent(target || '');


        /*
         * GAS画面から開いた場合
         * 元の画面へバーコードを送る
         */

        if (window.opener) {

          window.opener.postMessage(

            {
              barcode: barcode,
              target: target
            },

            '*'

          );

          window.close();

        }

        else {

          window.location.href =
            url;

        }

      }

      return;

    }


  }

  catch (error) {

    console.log(error);

  }


  /* 200ms後に再チェック */

  if (scanning) {

    setTimeout(
      scanBarcode,
      200
    );

  }

}


/* =========================
   カメラ停止
========================= */

function stopCamera() {

  scanning = false;


  if (stream) {

    var tracks =
      stream.getTracks();


    for (
      var i = 0;
      i < tracks.length;
      i++
    ) {

      tracks[i].stop();

    }


    stream = null;

  }


  var video =
    document.getElementById('video');


  video.srcObject = null;

}


/* =========================
   自動起動
========================= */

window.onload =
  function() {

    startCamera();

  };

</script>

</body>

</html>
